[project]
name = "webshell-mag"
version = "1.6.3"
description = "PHP webshell manager with SM4-CBC + HMAC v2 protocol and a Qt6 GUI"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "webshell-mag contributors" }]
keywords = ["webshell", "security", "sm4", "qt6", "pentest", "php"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "PyQt6>=6.6",
    "requests>=2.31",
]

[project.optional-dependencies]
tls = ["curl_cffi>=0.7"]

[project.scripts]
webshell-mag = "wshell.__main__:main"
wsmag = "wshell.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wshell"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
]
